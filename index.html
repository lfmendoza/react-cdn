<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de Comentarios en React</title>
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      body {
        font-family: Arial, sans-serif;
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .comment-form {
        margin-bottom: 20px;
        border: 1px solid #ddd;
        padding: 15px;
        border-radius: 5px;
        background-color: #f9f9f9;
      }
      .comment-form input {
        width: 70%;
        padding: 8px;
        margin-right: 10px;
      }
      .comment-form button {
        padding: 8px 15px;
        background-color: #4caf50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      .comment-form button:hover {
        background-color: #45a049;
      }
      .comment-list {
        margin-top: 20px;
      }
      .comment-item {
        padding: 10px;
        border-bottom: 1px solid #eee;
        margin-bottom: 10px;
      }
      h1,
      h2 {
        color: #333;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      function CommentForm({ onAddComment }) {
        const [commentText, setCommentText] = React.useState("");

        const handleInputChange = (e) => {
          setCommentText(e.target.value);
        };

        const handleSubmit = (e) => {
          e.preventDefault();

          if (commentText.trim() !== "") {
            onAddComment(commentText);
            setCommentText("");
          }
        };

        return (
          <div className="comment-form">
            <h2>Añadir nuevo comentario</h2>
            <form onSubmit={handleSubmit}>
              <input
                type="text"
                value={commentText}
                onChange={handleInputChange}
                placeholder="Escribe tu comentario aquí..."
              />
              <button type="submit">Enviar comentario</button>
            </form>
          </div>
        );
      }

      function CommentItem({ text, index }) {
        return (
          <div className="comment-item">
            <strong>Comentario #{index + 1}:</strong> {text}
          </div>
        );
      }

      function App() {
        const [comments, setComments] = React.useState([]);

        const addComment = (newComment) => {
          setComments([...comments, newComment]);
        };

        return (
          <div>
            <h1>¡Hola, bienvenido a React!</h1>
            <CommentForm onAddComment={addComment} />

            <div className="comment-list">
              <h2>Comentarios ({comments.length})</h2>
              {comments.length === 0 && <p>No hay comentarios</p>}
              {comments.map((comment, index) => (
                <CommentItem key={index} text={comment} index={index} />
              ))}
            </div>
          </div>
        );
      }
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
